# =============================================================
# 测试环境配置 —— 覆盖 main 的 application.yml
#
# 本机无 Docker，Testcontainers 不可用（spec Seam 3 原计划用它），
# 故用 H2 内存库（MySQL 兼容模式）替代 MySQL。
# Redis 黑名单在集成测试中由内存实现替身接管（见 AuthIntegrationTest）。
# =============================================================

spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:tickettest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

  # H2 与 MySQL 的 DDL 方言有差异（AUTO_INCREMENT / INSERT IGNORE / ENGINE），
  # 故测试用独立的一份建表与种子脚本
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql

  # ticket 08 —— 集成测试环境的 Spring AI 配置。
  # 测试机无真实 DeepSeek key，使用 fake key 让 Spring AI 自动装配通过；
  # 真正调用由 TicketAiTestConfig.@Primary ChatClient mock 接管，避免任何真实 HTTP 请求。
  ai:
    openai:
      api-key: sk-test-fake-key-for-integration-tests-only
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
          max-tokens: 2048
          timeout: 30s

  # ticket 09 —— 测试环境排除 Redisson 自动装配（避免本机无 Redis 时启动失败）。
  # 集成测试若需要 Redis，由 TicketCacheIntegrationTest 用 Testcontainers
  # GenericContainer 手动启动，不依赖 Spring 自动装配。
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2

jwt:
  secret: test-only-secret-key-for-integration-tests-32bytes+
  expire-minutes: 30

logging:
  level:
    root: WARN
    com.ticket: DEBUG
