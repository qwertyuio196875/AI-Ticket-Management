server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-ticket-system

  # ticket 12 —— 附件上传 multipart 限制：单文件 50MB，整请求 50MB。
  # 超限请求在容器解析阶段抛 MaxUploadSizeExceededException，
  # 由 GlobalExceptionHandler 统一返回 400 + 中文提示。
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # ticket 02 起启用 DataSource / Redis / Security 自动装配
  # （ticket 01 tracer bullet 阶段曾整体排除，现已按需开启）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ai_ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}

  # 建表 + 种子数据（本项目不引入 Flyway，见 spec Out of Scope）
  # DDL 用 IF NOT EXISTS、种子用 INSERT IGNORE，可重复执行
  sql:
    init:
      mode: always
      schema-locations: classpath:db/mysql/schema.sql
      data-locations: classpath:db/mysql/data.sql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s

  # ticket 08 启用 Spring AI —— ChatClient + DeepSeek（OpenAI 兼容协议，详见 ADR-0028）。
  # api-key 仅取环境变量，无默认值：生产部署必须设置 DEEPSEEK_API_KEY，
  # 否则 Spring AI 自动装配 fail-fast（避免静默用空 key 启动）。
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
          max-tokens: 2048
          timeout: 30s

  # ticket 11 —— Springdoc / Knife4j 文档端点（详见 ADR-0032）。
  # /swagger-ui.html 默认托管；Knife4j 接管 /doc.html 不需要改这里。
  # springdoc.api-docs.path 控制 /v3/api-docs 与 /v3/api-docs.yaml 的根路径。
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      # knife4j.production=true 时关闭增强 UI，保留基础 swagger-ui
      enabled: true

mybatis-plus:
  configuration:
    # 下划线字段名 → 驼峰属性名（create_time → createTime）
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# JWT 单 token 方案（30 分钟过期，见 spec）
jwt:
  # ⚠ 生产环境必须用环境变量 JWT_SECRET 覆盖；HMAC-SHA256 要求 ≥ 32 字节
  secret: ${JWT_SECRET:dev-only-secret-please-override-in-production-env-32bytes+}
  expire-minutes: 30
  header: Authorization
  token-prefix: "Bearer "

# ticket 12 —— 阿里云 OSS 附件存储（ADR-0014）。
# enabled 默认 false：无阿里云账号时走本地文件降级（./tmp/oss/，.gitignore 已排除）。
# 生产部署设 ALIYUN_OSS_ENABLED=true + 对应环境变量，accessKey 不进配置文件 / Git。
aliyun:
  oss:
    enabled: ${ALIYUN_OSS_ENABLED:false}
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}

logging:
  level:
    root: INFO
    com.ticket: DEBUG
