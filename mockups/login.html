<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 工单管理系统 · 登录</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2/dist/index.css" />
  <style>
    :root {
      --bg-base: #fafafa;
      --bg-surface: #ffffff;
      --bg-subtle: #f5f5f5;
      --border-subtle: #e5e7eb;
      --border-default: #d4d4d4;
      --text-primary: #1f1f1f;
      --text-secondary: #605e5c;
      --text-tertiary: #8a8886;
      --accent: #0078d4;
      --accent-hover: #106ebe;
      --accent-pressed: #005a9e;
      --accent-subtle: rgba(0, 120, 212, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Segoe UI Variable", "Segoe UI", -apple-system,
        BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      color: var(--text-primary);
      background: var(--bg-base);
    }

    .login-container {
      display: flex;
      min-height: 100vh;
    }

    /* ============ 左侧品牌面板（Win11 极简） ============ */
    .brand-panel {
      flex: 1.1;
      background: var(--bg-surface);
      padding: 56px 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border-subtle);
      position: relative;
      overflow: hidden;
    }

    /* 一个非常微妙的装饰圆 — Win11 Mica 风格的轻盈感 */
    .brand-panel::before {
      content: '';
      position: absolute;
      top: -200px;
      right: -200px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-subtle) 0%, transparent 70%);
      pointer-events: none;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      position: relative;
      z-index: 1;
    }
    .brand-logo-icon {
      width: 32px; height: 32px;
      background: var(--accent-subtle);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
    }

    .brand-hero {
      position: relative;
      z-index: 1;
      max-width: 420px;
    }
    .brand-hero h1 {
      font-size: 32px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 12px;
      letter-spacing: -0.4px;
    }
    .brand-hero p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.65;
    }

    .brand-features {
      display: flex;
      gap: 6px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .feature-tag {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .brand-footer {
      font-size: 12px;
      color: var(--text-tertiary);
      position: relative;
      z-index: 1;
    }

    /* ============ 右侧表单面板 ============ */
    .form-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      background: var(--bg-surface);
    }

    .login-card {
      width: 100%;
      max-width: 340px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .form-group { margin-bottom: 14px; }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0 24px;
      font-size: 13px;
    }
    .form-options a {
      color: var(--accent);
      text-decoration: none;
    }
    .form-options a:hover { text-decoration: underline; }

    .login-btn {
      width: 100%;
      height: 36px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 6px !important;
    }
    .login-btn.el-button--primary {
      --el-button-bg-color: var(--accent);
      --el-button-border-color: var(--accent);
      --el-button-hover-bg-color: var(--accent-hover);
      --el-button-hover-border-color: var(--accent-hover);
      --el-button-active-bg-color: var(--accent-pressed);
      --el-button-active-border-color: var(--accent-pressed);
    }

    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    /* Element Plus 输入框 Win11 化覆盖 */
    .el-input--large {
      --el-input-height: 36px;
    }
    .el-input__wrapper {
      background: var(--bg-subtle) !important;
      border-radius: 6px !important;
      box-shadow: 0 0 0 1px var(--border-default) inset !important;
    }
    .el-input__wrapper:hover {
      box-shadow: 0 0 0 1px var(--accent) inset !important;
    }
    .el-input.is-focus .el-input__wrapper,
    .el-input__wrapper.is-focus {
      box-shadow: 0 0 0 1px var(--accent) inset !important;
      background: var(--bg-surface) !important;
    }
    .el-input__inner {
      color: var(--text-primary) !important;
    }
    .el-input__inner::placeholder {
      color: var(--text-tertiary) !important;
    }

    /* Checkbox Win11 化 */
    .el-checkbox__label { color: var(--text-secondary) !important; }

    /* 响应式：窄屏隐藏左侧 */
    @media (max-width: 900px) {
      .brand-panel { display: none; }
      .form-panel { flex: 1; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-container">

      <!-- 左侧品牌面板 -->
      <aside class="brand-panel">
        <div class="brand-logo">
          <div class="brand-logo-icon">
            <el-icon :size="18"><Cpu /></el-icon>
          </div>
          <span>AI 工单管理系统</span>
        </div>

        <div class="brand-hero">
          <h1>AI 智能工单</h1>
          <p>企业级运维协作平台 · 让 AI 协助你的团队更快响应、精准分类、智能回复。</p>
          <div class="brand-features">
            <span class="feature-tag">AI 自动分类</span>
            <span class="feature-tag">智能回复</span>
            <span class="feature-tag">RBAC 权限</span>
            <span class="feature-tag">微服务就绪</span>
          </div>
        </div>

        <div class="brand-footer">v1.0.0 · 企业版</div>
      </aside>

      <!-- 右侧表单 -->
      <main class="form-panel">
        <div class="login-card">
          <div class="login-title">欢迎登录</div>
          <div class="login-subtitle">请输入您的工号与密码</div>

          <el-form>
            <div class="form-group">
              <el-input
                v-model="form.username"
                placeholder="工号 / 用户名"
                size="large"
                :prefix-icon="User"
                clearable />
            </div>

            <div class="form-group">
              <el-input
                v-model="form.password"
                type="password"
                placeholder="密码"
                size="large"
                show-password
                :prefix-icon="Lock"
                @keyup.enter="handleLogin" />
            </div>

            <div class="form-options">
              <el-checkbox v-model="form.remember">记住此设备 7 天</el-checkbox>
              <a href="javascript:void(0)">忘记密码？</a>
            </div>

            <el-button
              type="primary"
              class="login-btn"
              :loading="loading"
              @click="handleLogin">
              登 录
            </el-button>

            <div class="login-footer">
              © 2026 AI 工单管理系统 · Powered by Spring Boot 3
            </div>
          </el-form>
        </div>
      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2/dist/index.full.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@element-plus/icons-vue"></script>
  <script>
    const { createApp, ref } = Vue;
    const { User, Lock, Cpu } = ElementPlusIconsVue;

    const App = createApp({
      setup() {
        const form = ref({ username: '', password: '', remember: false });
        const loading = ref(false);

        const handleLogin = () => {
          if (!form.value.username || !form.value.password) {
            ElementPlus.ElMessage.warning('请填写用户名和密码');
            return;
          }
          loading.value = true;
          setTimeout(() => {
            loading.value = false;
            ElementPlus.ElMessage.success('登录成功（演示，未连接后端）');
          }, 800);
        };

        return { form, loading, handleLogin, User, Lock, Cpu };
      }
    });

    App.use(ElementPlus);
    App.mount('#app');
  </script>
</body>
</html>
